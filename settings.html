<!DOCTYPE html>
<html>

<head>

<title>Settings</title>

<link rel="stylesheet"
      href="{{ url_for('static',
      filename='style.css') }}">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        ✎ Stationery Shop
        <span>Inventory & Billing</span>
    </div>

    <div class="menu">

        <a href="/dashboard">
            📊 Dashboard
        </a>

        <a href="/products">
            📦 Products
        </a>

        <a href="/billing">
            🧾 Billing
        </a>

        <a href="/sales">
            💰 Sales
        </a>

        <a href="/settings"
           class="active">
            ⚙ Settings
        </a>

        <a href="/logout">
            🚪 Logout
        </a>

    </div>

</div>


<div class="main">

<div class="topbar">

    Welcome, {{ session["username"] }}

</div>


<div class="content">

<div class="page-title">

<h1>Settings</h1>

<p>
Manage shop information
</p>

</div>


<div class="panel">

<h2>Shop Settings</h2>


<form method="POST">


<div class="form-group">

<label>Shop Name</label>

<input
    type="text"
    name="shop_name"
    value="{{ setting['shop_name'] }}"
    required>

</div>


<div class="form-group">

<label>Shopkeeper Name</label>

<input
    type="text"
    name="owner_name"
    value="{{ setting['owner_name'] }}"
    required>

</div>


<button
    class="btn btn-primary"
    type="submit">

    Save Settings

</button>

</form>

</div>

</div>

</div>

</body>

</html>
